name: ci: product-service tests → build → push to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - "microservices/product-service/**"
      - ".github/workflows/product-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (incl. pytest + httpx)
        working-directory: microservices/product-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: microservices/product-service
        env:
          PYTHONPATH: .
        run: pytest -q tests

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/product-service
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/product-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}
